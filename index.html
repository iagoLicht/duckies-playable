<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Duckies Pop</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f8dfe4; overflow: hidden; }
    body { overscroll-behavior: none; }
    /* The canvas fills this box exactly and is measured off it (see
       src/game/layout.ts), so the box is anchored rather than centred: any
       sub-pixel overflow spills off one edge instead of being split across
       both, and there is no arrangement in which a hairline of page background
       can appear between the two. */
    #game { position: fixed; inset: 0; overflow: hidden; }
    canvas { display: block; position: absolute; top: 0; left: 0; }
    /* a drag-slingshot game must not fight scrolling, selection, or tap highlights */
    #game, canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
