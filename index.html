<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Duckies Pop</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f8dfe4; overflow: hidden; }
    body { overscroll-behavior: none; }
    #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    /* a drag-slingshot game must not fight scrolling, selection, or tap highlights */
    #game, canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
